spring.application.name=destinos-api
server.port=8080

# ---- Conexao com PostgreSQL ----
# As credenciais podem ser sobrescritas por variaveis de ambiente
# (DB_URL, DB_USERNAME, DB_PASSWORD), sem precisar alterar este arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agencia_viagens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# "update" cria/ajusta as tabelas automaticamente a partir das entidades.
# Em producao real, o recomendado seria usar migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mensagens de erro mais detalhadas durante o desenvolvimento
server.error.include-message=always
server.error.include-binding-errors=always
