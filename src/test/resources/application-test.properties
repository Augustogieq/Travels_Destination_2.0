spring.application.name=destinos-api

# Banco em memoria (H2), usado apenas durante a execucao dos testes
# automatizados (mvn test), para nao depender de um PostgreSQL real
# disponivel no ambiente de build.
spring.datasource.url=jdbc:h2:mem:destinos_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
