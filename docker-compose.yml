version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: destinos-api-postgres
    environment:
      POSTGRES_DB: agencia_viagens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - destinos_postgres_data:/var/lib/postgresql/data

volumes:
  destinos_postgres_data:
